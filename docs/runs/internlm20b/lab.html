le","yref":"y6"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"—","textangle":0,"x":0.455,"xanchor":"left","xref":"x6","y":0.12,"yanchor":"middle","yref":"y6"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"17 * 19 = 323","textangle":0,"x":0.725,"xanchor":"left","xref":"x6","y":0.12,"yanchor":"middle","yref":"y6"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eA\u003c\u002fb\u003e   nvidia-smi is capped at the card: BF16 fills 11,892 of 12,288 MiB VRAM and spills the rest into shared GPU memory. NF4 holds 11,578 MiB and stays on\u003cbr\u003ethe card.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003envidia-smi dedicated VRAM, MiB · left uncompressed, right compressed · same 0–12,288 scale · session-local time · this meter stops at the card; shared GPU memory is the pair below\u003c\u002fspan\u003e","textangle":0,"x":0.0,"xanchor":"left","xref":"paper","y":0.964992389649924,"yanchor":"top","yref":"paper","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eF\u003c\u002fb\u003e   GPU memory is not just VRAM: after load BF16 holds 37,906 MiB (26,014 MiB of that sits in shared GPU memory). NF4 stays at 10,432 MiB, inside the\u003cbr\u003ecard.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003eCUDA working set, MiB · torch.cuda.memory_reserved · same Y on both · the part above the card limit is shared GPU memory (system RAM on WDDM)\u003c\u002fspan\u003e","textangle":0,"x":0.0,"xanchor":"left","xref":"paper","y":0.6910197869101979,"yanchor":"top","yref":"paper","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eB\u003c\u002fb\u003e   Weights stay packed: torch holds 10,273 MiB for 10,062 MiB of NF4 weights — the dense BF16 copy of those weights (37,882 MiB) is never materialised.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003eVRAM after load, MiB, same scale as A · nvidia-smi is the whole card, torch is the allocator; the difference is context and desktop, and it is not subtracted\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x5 domain","y":1,"yanchor":"top","yref":"y5 domain","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eC\u003c\u002fb\u003e   The model still talks: all 3 replies hit their needle (Paris \u002f Berlin \u002f 323) — and both codecs answer the same prompts.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003eidentical prompts, greedy, max_new_tokens = 64, independent turns · replies are clipped for width; messages.csv has the full text\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x6 domain","y":1,"yanchor":"top","yref":"y6 domain","yshift":40},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eD\u003c\u002fb\u003e   TTFT is prefill: first token per turn, no mean recorded.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003etime to first token per turn, ms — prefill only (first_token − msg_send)\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x7 domain","y":1,"yanchor":"top","yref":"y7 domain","yshift":48},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eE\u003c\u002fb\u003e   Decode throughput per turn; the two paths are different stacks.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003edecode throughput per turn, tokens\u002fs — HF generate with dense cuBLAS GEMM against\u003cbr\u003ethe fused NF4 loop; not a kernel benchmark\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x8 domain","y":1,"yanchor":"top","yref":"y8 domain","yshift":48},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"model weights","textangle":0,"x":0.01593625498007968,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"rest of torch (KV cache, activations)","textangle":0,"x":0.120824203187251,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"outside torch (CUDA context, desktop)","textangle":0,"x":0.34947709163346613,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"free headroom on the card","textangle":0,"x":0.5781299800796813,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"peak nvidia-smi","textangle":0,"x":0.7364342629482071,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":18.0},"showarrow":false,"text":"internlm2_5-20b-chat on one RTX 3080 12 GB — NF4 driver against dense BF16","textangle":0,"x":0,"xanchor":"left","xref":"paper","y":1.0730593607305936,"yanchor":"bottom","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":12.0},"showarrow"
