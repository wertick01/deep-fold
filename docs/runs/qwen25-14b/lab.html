rif","size":11.0},"showarrow":false,"text":"The capital of Germany is Berlin.","textangle":0,"x":0.455,"xanchor":"left","xref":"x6","y":0.36,"yanchor":"middle","yref":"y6"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"The capital of Germany is Berlin.","textangle":0,"x":0.725,"xanchor":"left","xref":"x6","y":0.36,"yanchor":"middle","yref":"y6"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"3","textangle":0,"x":0.0,"xanchor":"left","xref":"x6","y":0.12,"yanchor":"middle","yref":"y6"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"What is 17 times 19? Reply with the number only.","textangle":0,"x":0.026,"xanchor":"left","xref":"x6","y":0.12,"yanchor":"middle","yref":"y6"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"323","textangle":0,"x":0.385,"xanchor":"left","xref":"x6","y":0.12,"yanchor":"middle","yref":"y6"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"323","textangle":0,"x":0.455,"xanchor":"left","xref":"x6","y":0.12,"yanchor":"middle","yref":"y6"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"323","textangle":0,"x":0.725,"xanchor":"left","xref":"x6","y":0.12,"yanchor":"middle","yref":"y6"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eA\u003c\u002fb\u003e   nvidia-smi is capped at the card: BF16 fills 11,955 of 12,288 MiB VRAM and spills the rest into shared GPU memory. NF4 holds 8,913 MiB and stays on\u003cbr\u003ethe card.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003envidia-smi dedicated VRAM, MiB · left uncompressed, right compressed · same 0–12,288 scale · session-local time · this meter stops at the card; shared GPU memory is the pair below\u003c\u002fspan\u003e","textangle":0,"x":0.0,"xanchor":"left","xref":"paper","y":0.964992389649924,"yanchor":"top","yref":"paper","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eF\u003c\u002fb\u003e   GPU memory is not just VRAM: after load BF16 holds 28,308 MiB (16,353 MiB of that sits in shared GPU memory). NF4 stays at 7,766 MiB, inside the\u003cbr\u003ecard.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003eCUDA working set, MiB · torch.cuda.memory_reserved · same Y on both · the part above the card limit is shared GPU memory (system RAM on WDDM)\u003c\u002fspan\u003e","textangle":0,"x":0.0,"xanchor":"left","xref":"paper","y":0.6910197869101979,"yanchor":"top","yref":"paper","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eB\u003c\u002fb\u003e   Weights stay packed: torch holds 7,539 MiB for 7,483 MiB of NF4 weights — the dense BF16 copy of those weights (28,172 MiB) is never materialised.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003eVRAM after load, MiB, same scale as A · nvidia-smi is the whole card, torch is the allocator; the difference is context and desktop, and it is not subtracted\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x5 domain","y":1,"yanchor":"top","yref":"y5 domain","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eC\u003c\u002fb\u003e   The model still talks: all 6 replies hit their needle (Paris \u002f Berlin \u002f 323) — and both codecs answer the same prompts.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003eidentical prompts, greedy, max_new_tokens = 64, independent turns · replies are clipped for width; messages.csv has the full text\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x6 domain","y":1,"yanchor":"top","yref":"y6 domain","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eD\u003c\u002fb\u003e   TTFT is prefill: NF4 gets there in 759 ms, 270 ms ahead of BF16.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003etime to first token per turn, ms — prefill only (first_token − msg_send)\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x7 domain","y":1,"yanchor":"top","yref":"y7 domain","yshift":48},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eE\u003c\u002fb\u003e   Decode: NF4 6.6 tok\u002fs against BF16 0.9 — ahead, on another stack.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003edecode throughput per turn, tokens\u002fs — HF generate with dense cuBLAS GEMM against\u003cbr\u003ethe fused NF4 loop; not a kernel benchmark\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x8 domain","y":1,"yanchor":"top","yref":"y8 domain","yshift":48},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"model weights","textangle":0,"x":0.01593625498007968,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"rest of torch (KV cache, activations)","textangle":0,"x":0.120824203187251,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"outside torch (CUDA context, desktop)","textangle":0,"x":0.34947709163346613,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"free headroom on the card","textangle":0,"x":0.5781299800796813,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"peak nvidia-smi","textangle":0,"x":0.7364342629482071,"xanchor":"left","xref":"paper","y":0.35920852359208527,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":18.0},"showarrow":false,"text":"Qwen2.5-14B-Instruct on one RTX 3080 12 GB — NF4 driver against dense BF16","textangle":0,"x":0,"xanchor":"left","xref":"paper","y":1.0730593607305936,"yanchor":"bottom","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":12.0},"showarrow":false,"text":"One card, one chat script, three identical prompts per codec. Each codec runs in its own process so VRAM returns before the next load. VRAM graphs sit side by side on one 0–12288 MiB scale.","textangle":0,"x":0,"xanchor":"left","xref":"paper","y":1.0547945205479452,"yanchor":"bottom","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":10.5},"showarrow":false,"text":"BF16 dense = HuggingFace from_pretrained + generate.  NF4 driver = CompressedLinear + fused NF4 GEMM + TokenLoop.","textangle":0,"x":0,"xanchor":"left","xref":"paper","y":1.0403348554033485,"yanchor":"bottom","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":10.5},"showarrow":false,"text":"\u003cb\u003eMEASURED RUN\u003c\u002fb\u003e — nvidia-smi and torch.cuda sampled throughout both sessions; the numbers are as recorded, with nothing corrected or subtracted.","textangle":0,"x":0.006,"xanchor":"left","xref":"paper","y":1.0190258751902588,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":10.0},"showarrow":false,"text":"Measured run. Greedy decoding, max_new_tokens = 64, turns are independent — the KV cache is reset between prompts, so every time-to-first-token is a clean prefill. Time is\u003cbr\u003esession-local: each codec is loaded, warmed up, asked the three prompts and unloaded, and both sessions start at t = 0. nvidia-smi totals are reported as measured: they include\u003cbr\u003ethe CUDA context and the Windows desktop compositor, and nothing is subtracted. Blank telemetry is a gap in the instrument, never a zero. Panel titles are generated from the\u003cbr\u003etables below, not written by hand. Sources: timeline.csv, events.csv, messages.csv, summary.csv.","textangle":0,"x":0,"xanchor":"left","xref":"paper","y":-0.0121765601217656,"yanchor":"top","yref":"paper"}],"margin":{"l":66,"r":30,"t":146,"b":78,"autoexpand":false},"font":{"family":"Arial, Helvetica, sans-serif","size":11.0,"color":"#151515"},"hoverlabel":{"font":{"family":"Arial, Helvetica, sans-serif","size":10.5},"namelength":-1},"legend":{"font":{"family":"Arial, Helvetica, sans-serif","size":10.5,"color":"#151515"},"orientation":"h","x":1,"xanchor":"right","y":1.0898021308980212,"yanchor":"top","bgcolor":"rgba(0,0,0,0)","borderwidth":0,"itemsizing":"constant","tracegroupgap":6},"width":1100,"height":1538,"paper_bgcolor":"#FFFFFF","plot_bgcolor":"#FFFFFF","barmode":"group","bargap":0.42,"hovermode":"x unified","showlegend":true},                        {"responsive": true}                    )                };            </script>        </div>
