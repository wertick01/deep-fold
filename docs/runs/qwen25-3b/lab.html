t":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"And the capital of Germany?","textangle":0,"x":0.026,"xanchor":"left","xref":"x4","y":0.36,"yanchor":"middle","yref":"y4"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"Berlin","textangle":0,"x":0.385,"xanchor":"left","xref":"x4","y":0.36,"yanchor":"middle","yref":"y4"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"The capital of Germany is Berlin.","textangle":0,"x":0.455,"xanchor":"left","xref":"x4","y":0.36,"yanchor":"middle","yref":"y4"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"The capital of Germany is Berlin.","textangle":0,"x":0.725,"xanchor":"left","xref":"x4","y":0.36,"yanchor":"middle","yref":"y4"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"3","textangle":0,"x":0.0,"xanchor":"left","xref":"x4","y":0.12,"yanchor":"middle","yref":"y4"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"What is 17 times 19? Reply with the number only.","textangle":0,"x":0.026,"xanchor":"left","xref":"x4","y":0.12,"yanchor":"middle","yref":"y4"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"323","textangle":0,"x":0.385,"xanchor":"left","xref":"x4","y":0.12,"yanchor":"middle","yref":"y4"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"323","textangle":0,"x":0.455,"xanchor":"left","xref":"x4","y":0.12,"yanchor":"middle","yref":"y4"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":11.0},"showarrow":false,"text":"323","textangle":0,"x":0.725,"xanchor":"left","xref":"x4","y":0.12,"yanchor":"middle","yref":"y4"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eA\u003c\u002fb\u003e   VRAM is the product: after load NF4 holds the model in 3,142 MiB where dense BF16 needs 7,477 MiB — 4,335 MiB, 35% of the card, given back.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003envidia-smi dedicated VRAM, MiB · left uncompressed, right compressed · same 0–12,288 scale · session-local time\u003c\u002fspan\u003e","textangle":0,"x":0.0,"xanchor":"left","xref":"paper","y":0.954,"yanchor":"top","yref":"paper","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eB\u003c\u002fb\u003e   Weights stay packed: torch holds 1,618 MiB for 1,563 MiB of NF4 weights — the dense BF16 copy of those weights (5,886 MiB) is never materialised.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003eVRAM after load, MiB, same scale as A · nvidia-smi is the whole card, torch is the allocator; the difference is context and desktop, and it is not subtracted\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x3 domain","y":1,"yanchor":"top","yref":"y3 domain","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eC\u003c\u002fb\u003e   The model still talks: all 6 replies hit their needle (Paris \u002f Berlin \u002f 323) — and both codecs answer the same prompts.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003eidentical prompts, greedy, max_new_tokens = 64, independent turns · replies are clipped for width; messages.csv has the full text\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x4 domain","y":1,"yanchor":"top","yref":"y4 domain","yshift":40},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eD\u003c\u002fb\u003e   TTFT is prefill, and NF4 pays it: 212 ms against 52 ms for BF16.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003etime to first token per turn, ms — prefill only (first_token − msg_send)\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x5 domain","y":1,"yanchor":"top","yref":"y5 domain","yshift":48},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":13.0},"showarrow":false,"text":"\u003cb\u003eE\u003c\u002fb\u003e   Decode: BF16 23.1 tok\u002fs, NF4 17.0 — we are not faster here.\u003cbr\u003e\u003cspan style=\"font-size:10.5px;color:#5B5B5B\"\u003edecode throughput per turn, tokens\u002fs — HF generate with dense cuBLAS GEMM against\u003cbr\u003ethe fused NF4 loop; not a kernel benchmark\u003c\u002fspan\u003e","textangle":0,"x":0,"xanchor":"left","xref":"x6 domain","y":1,"yanchor":"top","yref":"y6 domain","yshift":48},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"model weights","textangle":0,"x":0.01593625498007968,"xanchor":"left","xref":"paper","y":0.472,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"rest of torch (KV cache, activations)","textangle":0,"x":0.120824203187251,"xanchor":"left","xref":"paper","y":0.472,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"outside torch (CUDA context, desktop)","textangle":0,"x":0.34947709163346613,"xanchor":"left","xref":"paper","y":0.472,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"free headroom on the card","textangle":0,"x":0.5781299800796813,"xanchor":"left","xref":"paper","y":0.472,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":9.5},"showarrow":false,"text":"peak nvidia-smi","textangle":0,"x":0.7364342629482071,"xanchor":"left","xref":"paper","y":0.472,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#151515","family":"Arial, Helvetica, sans-serif","size":18.0},"showarrow":false,"text":"Qwen2.5-3B-Instruct on one RTX 3080 12 GB — NF4 driver against dense BF16","textangle":0,"x":0,"xanchor":"left","xref":"paper","y":1.096,"yanchor":"bottom","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":12.0},"showarrow":false,"text":"One card, one chat script, three identical prompts per codec. Each codec runs in its own process so VRAM returns before the next load. VRAM graphs sit side by side on one 0–12288 MiB scale.","textangle":0,"x":0,"xanchor":"left","xref":"paper","y":1.072,"yanchor":"bottom","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":10.5},"showarrow":false,"text":"BF16 dense = HuggingFace from_pretrained + generate.  NF4 driver = CompressedLinear + fused NF4 GEMM + TokenLoop.","textangle":0,"x":0,"xanchor":"left","xref":"paper","y":1.053,"yanchor":"bottom","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":10.5},"showarrow":false,"text":"\u003cb\u003eMEASURED RUN\u003c\u002fb\u003e — nvidia-smi and torch.cuda sampled throughout both sessions; the numbers are as recorded, with nothing corrected or subtracted.","textangle":0,"x":0.006,"xanchor":"left","xref":"paper","y":1.025,"yanchor":"middle","yref":"paper"},{"align":"left","font":{"color":"#5B5B5B","family":"Arial, Helvetica, sans-serif","size":10.0},"showarrow":false,"text":"Measured run. Greedy decoding, max_new_tokens = 64, turns are independent — the KV cache is
